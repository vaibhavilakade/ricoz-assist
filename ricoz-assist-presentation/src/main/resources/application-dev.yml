spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/ricoz_assist_dev}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:ricoz_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
  redis:
    host: localhost
    port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ricoz.assist: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
