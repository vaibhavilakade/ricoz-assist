spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ricoz_assist_dev
    username: ${DB_USERNAME:ricoz_user}
    password: ${DB_PASSWORD:ricoz_password}
  redis:
    host: localhost
    port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ricoz.assist: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
