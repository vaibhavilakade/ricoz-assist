apiVersion: v1
kind: ConfigMap
metadata:
  name: ricoz-assist-config
data:
  application.yml: |
    spring:
      application:
        name: ricoz-assist
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
    server:
      port: 8080
      compression:
        enabled: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: when-authorized
      metrics:
        export:
          prometheus:
            enabled: true
